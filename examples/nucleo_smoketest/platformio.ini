; PlatformIO Project Configuration File
;
; Minimal bring-up smoke test for the STM32 Nucleo-WL55JC1: no filesystem,
; just a loopback Interface pair proving the core library builds, boots, and
; runs its packet path on real hardware. Also brings up the onboard sub-GHz
; LoRa radio (construct + begin()) as a standalone step -- see src/main.cpp.
;
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
upload_speed = 460800
build_type = release
build_unflags =
build_flags =
	-std=gnu++17
	-Wall
	-Wno-missing-field-initializers
	-Wno-format
	; PosixFileSystem (UniversalFileSystem's non-NRF52 fallback) unconditionally
	; includes ESP32's LittleFS.h and won't compile here -- persistence stays off.
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git
	; microReticulum's library.json declares microStore as a dependency, but
	; without a pinned commit here PlatformIO's LDF resolves it against the
	; registry's latest instead -- which has since renamed TypedKeyStore to
	; TypedStore and breaks the build. Pin explicitly to force the known-good
	; commit (matches platformio.ini/library.json at the repo root).
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
	microReticulum=symlink://../..
	; RadioLib's STM32WL HAL needs the framework-bundled SubGhz library's
	; include path added to its own build env -- handled by the extra_script
	; below (PlatformIO's LDF doesn't auto-resolve it as a plain lib_dep).
	jgromes/RadioLib @ ^7.0.0

; MCU: STM32WL55JC (dual-core Arm Cortex-M4 @ 48 MHz + Cortex-M0+, LPWAN SoC)
; SRAM: 64 KB   Flash: 256 KB internal
[env:nucleo_wl55jc]
framework = arduino
platform = ststm32
board = nucleo_wl55jc
build_unflags =
	-fno-exceptions    ; Required for exception handling on ststm32
	-fno-rtti          ; Required for exception handling on ststm32
	--specs=nano.specs ; Required for exception handling on ststm32
build_flags =
	${env.build_flags}
	-fexceptions        ; Required for exception handling on ststm32
	-frtti              ; Required for exception handling on ststm32
	--specs=nosys.specs ; Required for exception handling on ststm32
	-DBOARD_STM32
	-DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
	-DRNS_CONTAINER_ALLOCATOR=RNS_HEAP_ALLOCATOR
	-DMSGPACK_USE_BOOST=OFF
	; 256KB flash is tight -- avoid the TRACE-level defaults (which bake in a
	; lot of log string literals) that DebugLog/RNS::Log fall back to when
	; nothing is specified.
	-DDEBUGLOG_DEFAULT_LOG_LEVEL_ERROR
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_ERROR
	; Exception unwind tables (.ARM.extab/.ARM.exidx, required by -fexceptions
	; on ARM EHABI) push this right past 256KB flash; LTO strips enough dead
	; code across TUs to close the gap without cutting features.
	-flto
	; Split into per-function/per-data sections so the linker's --gc-sections
	; can drop anything actually unreferenced at link time (finer-grained
	; than LTO's whole-archive view alone).
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	; Only the onboard STM32WL radio (SX126x-based) is used -- exclude every
	; other RadioLib module/protocol so its overhead doesn't count against
	; the 256KB budget. STM32WLX itself depends on SX126X, so that one stays.
	-DRADIOLIB_EXCLUDE_CC1101
	-DRADIOLIB_EXCLUDE_NRF24
	-DRADIOLIB_EXCLUDE_RF69
	-DRADIOLIB_EXCLUDE_SX1231
	-DRADIOLIB_EXCLUDE_SI443X
	-DRADIOLIB_EXCLUDE_RFM2X
	-DRADIOLIB_EXCLUDE_SX127X
	-DRADIOLIB_EXCLUDE_SX128X
	-DRADIOLIB_EXCLUDE_LR11X0
	-DRADIOLIB_EXCLUDE_AFSK
	-DRADIOLIB_EXCLUDE_AX25
	-DRADIOLIB_EXCLUDE_HELLSCHREIBER
	-DRADIOLIB_EXCLUDE_MORSE
	-DRADIOLIB_EXCLUDE_RTTY
	-DRADIOLIB_EXCLUDE_SSTV
	-DRADIOLIB_EXCLUDE_BELL
	-DRADIOLIB_EXCLUDE_APRS
	-DRADIOLIB_EXCLUDE_LORAWAN
	-DRADIOLIB_EXCLUDE_FSK4
	-DRADIOLIB_EXCLUDE_PAGER
; STM32WL's CMSIS header #defines RNG as a peripheral base-address macro,
; colliding with Crypto library's global `RNGClass RNG` object -- see the
; script for details. Scoped to just Crypto's own build env so it doesn't
; also apply (and break) the framework's board/variant sources.
extra_scripts = ../common/fix_stm32wl_quirks.py
lib_deps =
	${env.lib_deps}
