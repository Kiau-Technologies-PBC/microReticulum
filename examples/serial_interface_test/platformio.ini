; PlatformIO Project Configuration File
;
; Host-side Unity test for SerialInterface's SLIP framing logic. No serial
; hardware required -- exercises SerialInterface::slip_encode and
; slip_decode_byte directly. Run with: pio test -e native
;
; https://docs.platformio.org/page/projectconf.html

[env:native]
platform = native
build_flags =
	-std=gnu++17
	-Wall
	-Wno-missing-field-initializers
lib_deps =
	ArduinoJson@^7.4.2
	MsgPack@^0.4.2
	https://github.com/attermann/Crypto.git
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
	microReticulum=symlink://../..
	serial_interface=symlink://../common/serial_interface
lib_compat_mode = off
test_framework = unity
